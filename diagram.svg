<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="ui-monospace, SF Mono, Menlo, monospace">
  <rect width="880" height="520" fill="#080c14"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#121a28" stroke-width="0.5"/></pattern>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34d399"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fb7185"/></marker>
  </defs>
  <rect width="880" height="520" fill="url(#grid)"/>

  <!-- TASK -->
  <rect x="360" y="20" width="160" height="46" rx="8" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="48" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">TASK</text>
  <path d="M440 66 L220 118 M440 66 L440 118 M440 66 L660 118" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)" fill="none"/>

  <!-- experts -->
  <rect x="120" y="118" width="200" height="46" rx="8" fill="rgba(30,64,175,.35)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="220" y="139" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="bold">RESEARCH</text>
  <text x="220" y="157" text-anchor="middle" fill="#93c5fd" font-size="11">DeepSeek</text>

  <rect x="340" y="118" width="200" height="46" rx="8" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="440" y="139" text-anchor="middle" fill="#a7f3d0" font-size="13" font-weight="bold">CODING</text>
  <text x="440" y="157" text-anchor="middle" fill="#6ee7b7" font-size="11">Qwen3.8-27B</text>

  <rect x="560" y="118" width="200" height="46" rx="8" fill="rgba(120,53,15,.35)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="660" y="139" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="bold">CRITIQUE</text>
  <text x="660" y="157" text-anchor="middle" fill="#fcd34d" font-size="11">GLM-5.2</text>

  <!-- converge to judge -->
  <path d="M220 164 C220 230 420 230 432 262 M440 164 L440 262 M660 164 C660 230 460 230 448 262" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)" fill="none"/>

  <!-- judge -->
  <polygon points="440,262 496,300 440,338 384,300" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="440" y="305" text-anchor="middle" fill="#ddd6fe" font-size="13" font-weight="bold">JUDGE</text>
  <text x="440" y="322" text-anchor="middle" fill="#c4b5fd" font-size="10">Claude / DeepSeek</text>

  <!-- pass / fail -->
  <path d="M410 338 L280 400" stroke="#34d399" stroke-width="1.5" marker-end="url(#g)" fill="none"/>
  <path d="M470 338 L600 400" stroke="#fb7185" stroke-width="1.5" marker-end="url(#r)" fill="none"/>
  <text x="330" y="380" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold">PASS</text>
  <text x="550" y="380" text-anchor="middle" fill="#fb7185" font-size="12" font-weight="bold">FAIL</text>

  <!-- synthesis / reject -->
  <rect x="190" y="400" width="180" height="46" rx="8" fill="rgba(8,51,68,.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="280" y="428" text-anchor="middle" fill="#a5f3fc" font-size="13" font-weight="bold">SYNTHESIS</text>

  <rect x="510" y="400" width="180" height="46" rx="8" fill="rgba(136,19,55,.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="600" y="428" text-anchor="middle" fill="#fecdd3" font-size="13" font-weight="bold">REJECT</text>

  <!-- final result -->
  <path d="M280 446 L280 480" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a)" fill="none"/>
  <rect x="190" y="480" width="180" height="34" rx="8" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="280" y="502" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="bold">FINAL RESULT</text>
</svg>
